<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ragnarok Project - Steam Wishlist</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1b2838;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        p {
            color: #8f98a0;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(to right, #2a475e, #1b2838);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #417a9b;
            margin-bottom: 15px;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover {
            background: linear-gradient(to right, #355c7d, #2a475e);
        }
    </style>
    <script>
        // 페이지가 열리자마자 스팀 앱 스킴 실행 시도
        window.onload = function() {
            var steamAppUrl = "steam://url/StoreAppPage/4677140";
            var steamWebUrl = "https://store.steampowered.com/app/4677140/RAGNAROK_PROJECT/";

            // 스팀 앱으로 이동 시도
            window.location.href = steamAppUrl;

            // 일정 시간(1.5초) 뒤에도 페이지가 그대로 남아있다면(앱이 없다는 뜻) 웹 스토어로 이동
            setTimeout(function() {
                window.location.href = steamWebUrl;
            }, 1500);
        };
    </script>
</head>
<body>
    <div class="container">
        <h2>스팀 앱으로 이동 중입니다...</h2>
        <p>잠시만 기다려주세요. 자동으로 스팀 앱이 열리지 않으면 아래 버튼을 눌러주세요.</p>
        
        <!-- 혹시 리디렉션이 막히거나 수동으로 누르고 싶을 때를 대비한 버튼 -->
        <a href="https://store.steampowered.com/app/4677140/RAGNAROK_PROJECT/" class="btn">스팀 웹페이지로 이동</a>
    </div>
</body>
</html>
