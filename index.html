<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ragnarok Project - Steam Wishlist</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1b2838;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        p {
            color: #8f98a0;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn-app {
            display: block;
            background: #2a475e;
            color: #ffffff;
            padding: 15px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid #66c0f4;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .btn-web {
            display: block;
            background: transparent;
            color: #8f98a0;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #417a9b;
            box-sizing: border-box;
        }
    </style>
    <script>
        window.onload = function() {
            var userAgent = navigator.userAgent.toLowerCase();
            var steamWebUrl = "https://store.steampowered.com/app/4677140/RAGNAROK_PROJECT/";

            // 아이폰은 기존처럼 자동 진입 시도 유지
            if (userAgent.indexOf("iphone") > -1 || userAgent.indexOf("ipad") > -1) {
                window.location.href = "steam://url/StoreAppPage/4677140";
                setTimeout(function() {
                    window.location.href = steamWebUrl;
                }, 1500);
            }
        };
    </script>
</head>
<body>
    <div class="container">
        <h2>RAGNAROK PROJECT</h2>
        <p>스팀 앱이 설치되어 있다면 버튼을 눌러 바로 위시리스트에 추가하세요!</p>
        
        <!-- 안드로이드/아이폰 양쪽 모두 앱을 확실하게 띄우는 직행 버튼 -->
        <a href="intent://url/StoreAppPage/4677140#Intent;scheme=steam;package=com.valvesoftware.android.steam.community;end;" class="btn-app">스팀 앱에서 열기</a>
        
        <!-- 앱이 없을 때 쓰는 웹 브라우저 이동 버튼 -->
        <a href="https://store.steampowered.com/app/4677140/RAGNAROK_PROJECT/" class="btn-web">웹 브라우저로 이동</a>
    </div>
</body>
</html>
