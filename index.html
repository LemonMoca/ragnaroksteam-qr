<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ragnarok Project - Steam Wishlist</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1b2838;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        p {
            color: #8f98a0;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn-app {
            display: block;
            background: #2a475e;
            color: #ffffff;
            padding: 15px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid #66c0f4;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .btn-web {
            display: block;
            background: transparent;
            color: #8f98a0;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #417a9b;
            box-sizing: border-box;
        }
    </style>
    <script>
        var steamWebUrl = "https://store.steampowered.com/app/4677140/RAGNAROK_PROJECT/";

        // Android: intent://로 앱/웹 자동 분기
        var steamAndroidUrl = "intent://url/StoreAppPage/4677140"
            + "#Intent"
            + ";scheme=steam"
            + ";package=com.valvesoftware.android.steam.community"
            + ";S.browser_fallback_url=" + encodeURIComponent(steamWebUrl)
            + ";end";

        // iOS: 유니버설 링크 사용 (앱 설치 시 앱으로, 미설치 시 웹으로 자동 분기)
        var steamIOSUrl = "https://s.team/a/4677140";

        function openSteamApp(e) {
            e.preventDefault();
            var ua = navigator.userAgent.toLowerCase();

            if (/android/.test(ua)) {
                window.location.href = steamAndroidUrl;

            } else if (/iphone|ipad|ipod/.test(ua)) {
                // 유니버설 링크: Safari가 앱 유무 자동 판단
                window.location.href = steamIOSUrl;

            } else {
                // PC 등: 바로 웹으로
                window.location.href = steamWebUrl;
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h2>RAGNAROK PROJECT</h2>
        <p>스팀 앱이 설치되어 있다면 버튼을 눌러 바로 위시리스트에 추가하세요!</p>

        <a href="#" onclick="openSteamApp(event)" class="btn-app">
            스팀 앱에서 열기
        </a>

        <a href="https://store.steampowered.com/app/4677140/RAGNAROK_PROJECT/"
           class="btn-web">웹 브라우저로 이동</a>
    </div>
</body>
</html>
