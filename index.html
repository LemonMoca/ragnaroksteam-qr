<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ragnarok Project - Steam Wishlist</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1b2838;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        p {
            color: #8f98a0;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(to right, #2a475e, #1b2838);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #417a9b;
            margin-bottom: 15px;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover {
            background: linear-gradient(to right, #355c7d, #2a475e);
        }
    </style>
    <script>
        window.onload = function() {
            var userAgent = navigator.userAgent.toLowerCase();
            var steamWebUrl = "https://store.steampowered.com/app/4677140/RAGNAROK_PROJECT/";

            // 1. 안드로이드 기기일 때 (안드로이드 전용 인텐트 규격 사용)
            if (userAgent.indexOf("android") > -1) {
                // 안드로이드는 intent:// 형식을 써야 앱이 설치된 경우 앱을 바로 켭니다.
                // 앱이 없으면 구글 플레이스토어의 스팀 앱 페이지로 튕기거나 웹으로 가도록 fallback 설정
                var androidIntentUrl = "intent://url/StoreAppPage/4677140#Intent;scheme=steam;package=com.valvesoftware.android.steam.community;end;";
                window.location.href = androidIntentUrl;
            } 
            // 2. 아이폰(iOS) 기기일 때
            else if (userAgent.indexOf("iphone") > -1 || userAgent.indexOf("ipad") > -1) {
                var iosAppUrl = "steam://url/StoreAppPage/4677140";
                window.location.href = iosAppUrl;

                // 아이폰은 앱이 없으면 1.5초 뒤 웹 스토어로 백업 이동
                setTimeout(function() {
                    window.location.href = steamWebUrl;
                }, 1500);
            } 
            // 3. PC나 기타 기기일 때
            else {
                window.location.href = steamWebUrl;
            }
        };
    </script>
</head>
<body>
    <div class="container">
        <h2>스팀 앱으로 이동 중입니다...</h2>
        <p>잠시만 기다려주세요. 자동으로 스팀 앱이 열리지 않으면 아래 버튼을 눌러주세요.</p>
        
        <!-- 수동 이동 버튼 -->
        <a href="https://store.steampowered.com/app/4677140/RAGNAROK_PROJECT/" class="btn">스팀 웹페이지로 이동</a>
    </div>
</body>
</html>
