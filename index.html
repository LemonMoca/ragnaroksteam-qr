<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ragnarok Project - Steam Wishlist</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1b2838;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        p {
            color: #8f98a0;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn-app {
            display: block;
            background: #2a475e;
            color: #ffffff;
            padding: 15px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid #66c0f4;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .btn-web {
            display: block;
            background: transparent;
            color: #8f98a0;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #417a9b;
            box-sizing: border-box;
        }
    </style>
    <script>
        var steamWebUrl = "https://store.steampowered.com/app/4677140/RAGNAROK_PROJECT/";
        var steamAppUrl = "steam://url/StoreAppPage/4677140";

        function tryOpenSteamAndroid() {
            var appOpened = false;
            var fallbackTimer;

            // 앱 전환 감지 핸들러
            function onAppSwitch() {
                if (!appOpened) {
                    appOpened = true;
                    clearTimeout(fallbackTimer);
                }
            }

            // visibilitychange / pagehide / blur 세 가지 모두 감지
            document.addEventListener("visibilitychange", function () {
                if (document.hidden) onAppSwitch();
            });
            window.addEventListener("pagehide", onAppSwitch);
            window.addEventListener("blur", onAppSwitch);

            // steam:// 시도
            window.location.href = steamAppUrl;

            // 앱이 없거나 전환 감지 실패 시 fallback (3000ms로 여유있게)
            fallbackTimer = setTimeout(function () {
                if (!appOpened) {
                    window.location.href = steamWebUrl;
                }
            }, 3000);
        }

        window.onload = function () {
            var ua = navigator.userAgent.toLowerCase();
            var isIOS = /iphone|ipad|ipod/.test(ua);
            var isAndroid = /android/.test(ua);

            if (isIOS) {
                window.location.href = steamAppUrl;
                setTimeout(function () {
                    window.location.href = steamWebUrl;
                }, 1500);

            } else if (isAndroid) {
                tryOpenSteamAndroid();
            }
        };

        function openSteamAndroid(e) {
            var ua = navigator.userAgent.toLowerCase();
            if (!/android/.test(ua)) return;
            e.preventDefault();
            tryOpenSteamAndroid();
        }
    </script>
</head>
<body>
    <div class="container">
        <h2>RAGNAROK PROJECT</h2>
        <p>스팀 앱이 설치되어 있다면 버튼을 눌러 바로 위시리스트에 추가하세요!</p>

        <a href="steam://url/StoreAppPage/4677140"
           onclick="openSteamAndroid(event)"
           class="btn-app">스팀 앱에서 열기</a>

        <a href="https://store.steampowered.com/app/4677140/RAGNAROK_PROJECT/"
           class="btn-web">웹 브라우저로 이동</a>
    </div>
</body>
</html>
